<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Visualizar Dados do Repositório</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visualizar dados por repositório</h2>
        <form th:action="@{/view/repository-data}" method="get">
            <label for="repoId">Selecione o repositório:</label>
            <select name="repoId" id="repoId" required>
                <option value="">-- Selecione --</option>
                <option th:each="repo : ${repositories}"
                        th:value="${repo.id}"
                        th:text="${repo.name}">
                </option>
            </select>

            <label for="tabela">Selecione a tabela:</label>
            <select name="tabela" id="tabela" required>
                <option value="">-- Selecione --</option>
                <option value="commits">Commits</option>
                <option value="branches">Branches</option>
                <option value="contributors">Contributors</option>
                <option value="issues">Issues</option>
                <!-- Adicione outras tabelas se desejar -->
            </select>

            <button type="submit">Visualizar</button>
        </form>
    </div>
</body>
</html>
