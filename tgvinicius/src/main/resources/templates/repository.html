<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Repositório</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
        }

        .info-table {
            max-width: 600px;
        }

        .info-table td:first-child {
            font-weight: bold;
            width: 200px;
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <h1 th:text="'Repositório: ' + ${repository.name}"></h1>

	<a href="/view" style="text-decoration: none;">
		    <button type="button">Voltar</button>
	</a>

    <table class="info-table">
        <tr>
            <td>ID:</td>
            <td th:text="${repository.id}"></td>
        </tr>
        <tr>
            <td>URL:</td>
            <td><a th:href="${repository.htmlUrl}" th:text="${repository.htmlUrl}"></a></td>
        </tr>
        <tr>
            <td>Criado em:</td>
            <td th:text="${#dates.format(repository.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
            <td>Atualizado em:</td>
            <td th:text="${#dates.format(repository.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
            <td>Tamanho:</td>
            <td th:text="${repository.size}"></td>
        </tr>
        <tr>
            <td>Stars:</td>
            <td th:text="${repository.stargazers}"></td>
        </tr>
        <tr>
            <td>Watchers:</td>
            <td th:text="${repository.watchers}"></td>
        </tr>
        <tr>
            <td>Forks:</td>
            <td th:text="${repository.forks}"></td>
        </tr>
        <tr>
            <td>Issues abertas:</td>
            <td th:text="${repository.openIssues}"></td>
        </tr>
    </table>
</body>
</html>
