<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contribuidores</title>
    <meta charset="UTF-8">
	<style>
	    table {
	        width: 100%;
	        border-collapse: collapse;
	        margin-top: 20px;
	    }

	    th, td {
	        padding: 8px 12px;
	        border: 1px solid #ddd;
	        text-align: left;
	    }

	    th {
	        background-color: #f5f5f5;
	    }

	    h1 {
	        margin-bottom: 10px;
	    }
	</style>
</head>
<body>
    <h1>Contribuidores do Repositório</h1>

    <a th:href="@{/view}">Voltar</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contributor : ${contributors}">
                <td th:text="${contributor.id}">id</td>
                <td th:text="${contributor.name}">name</td>
                <td>
                    <a th:href="${contributor.url}" th:text="${contributor.url}" target="_blank">url</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
