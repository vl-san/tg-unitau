<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Commits</title>
    <meta charset="UTF-8">
	<style>
	    table {
	        width: 100%;
	        border-collapse: collapse;
	        margin-top: 20px;
	    }

	    th, td {
	        padding: 8px 12px;
	        border: 1px solid #ddd;
	        text-align: left;
	    }

	    th {
	        background-color: #f5f5f5;
	    }

	    h1 {
	        margin-bottom: 10px;
	    }
	</style>
</head>
<body>
    <h1>Commits do Repositório</h1>
	<a href="/view" style="text-decoration: none;">
		    <button type="button">Voltar</button>
	<a/>
    <table border="1">
        <thead>
            <tr>
                <th>SHA</th>
                <th>Autor (Login)</th>
                <th>Data de Criação</th>
                <th>Contribuidor</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="commit : ${commits}">
                <td th:text="${commit.sha}">sha</td>
                <td th:text="${commit.authorLogin}">authorLogin</td>
                <td th:text="${commit.createdAt}">createdAt</td>
                <td th:text="${commit.contributor != null ? commit.contributor.name : 'Desconhecido'}">contributor</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
